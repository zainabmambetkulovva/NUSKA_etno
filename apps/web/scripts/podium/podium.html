<!doctype html>
<html>
<body style="margin:0;background:transparent">
<canvas id="c"></canvas>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';

const STUMP = window.SCENE === 'stump';
const TRAY = window.SCENE === 'tray';
const W = window.RW || 3200, H = TRAY ? Math.round(W * 520 / 1300) : STUMP ? Math.round(W * 300 / 360) : Math.round(W * 932 / 2400);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ---------- deterministic noise ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function noise1(n) { const t = []; for (let i = 0; i < n; i++) t.push(rnd()); return (x) => { const i = Math.floor(x) % n, f = x - Math.floor(x); const a = t[(i + n) % n], b = t[(i + 1 + n) % n]; const s = f * f * (3 - 2 * f); return a + (b - a) * s; }; }

// ---------- procedural wood textures ----------
function sideGrain(w, h, base, dark, light) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const n = noise1(64), n2 = noise1(97);
  // long fibres running along the height (v), wavy
  for (let i = 0; i < 900; i++) {
    const x0 = rnd() * w, width = 0.4 + rnd() * 1.8, alpha = 0.04 + rnd() * 0.14;
    g.strokeStyle = rnd() < 0.62 ? dark : light; g.globalAlpha = alpha; g.lineWidth = width;
    g.beginPath();
    for (let y = 0; y <= h; y += 6) { const x = x0 + (n(y / 140 + i) - 0.5) * 7 + (n2(y / 31 + i * 3) - 0.5) * 1.6; y === 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
  }
  // broad colour streaks
  for (let i = 0; i < 40; i++) { g.globalAlpha = 0.06 + rnd() * 0.08; g.fillStyle = rnd() < 0.5 ? dark : light; g.fillRect(rnd() * w, 0, 8 + rnd() * 50, h); }
  // a few knots
  for (let k = 0; k < 3; k++) {
    const kx = rnd() * w, ky = rnd() * h;
    for (let r = 26; r > 2; r -= 3) { g.globalAlpha = 0.12; g.strokeStyle = dark; g.lineWidth = 1.5; g.beginPath(); g.ellipse(kx, ky, r * 0.55, r * 1.6, 0, 0, Math.PI * 2); g.stroke(); }
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function endGrain(size, base, ring, center) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const cx = size / 2 + (rnd() - 0.5) * size * 0.08, cy = size / 2 + (rnd() - 0.5) * size * 0.08;
  const grad = g.createRadialGradient(cx, cy, 0, cx, cy, size * 0.55);
  grad.addColorStop(0, center); grad.addColorStop(1, base);
  g.fillStyle = grad; g.fillRect(0, 0, size, size);
  const n = noise1(48);
  let r = 4;
  while (r < size * 0.72) {
    const w = 1 + rnd() * 2.2;
    g.strokeStyle = ring; g.globalAlpha = 0.32 + rnd() * 0.38; g.lineWidth = w * 1.4;
    g.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.05; a += 0.04) {
      const rr = r * (1 + (n(a * 3 + r * 0.05) - 0.5) * 0.06);
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      a === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
    r += 5 + rnd() * 9;
  }
  // fine radial checks
  g.globalAlpha = 0.08; g.strokeStyle = ring; g.lineWidth = 1;
  for (let i = 0; i < 6; i++) { const a = rnd() * Math.PI * 2, r0 = size * (0.05 + rnd() * 0.2), r1 = r0 + size * (0.05 + rnd() * 0.12); g.beginPath(); g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); g.stroke(); }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function planks(size, base, dark, light) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const count = 9, pw = size / count;
  for (let p = 0; p < count; p++) {
    const tone = (rnd() - 0.5) * 34;
    g.fillStyle = base; g.fillRect(p * pw, 0, pw, size);
    g.fillStyle = `rgba(${tone > 0 ? '255,230,190' : '60,30,10'},${Math.abs(tone) / 90})`; g.fillRect(p * pw, 0, pw, size);
    const n = noise1(50);
    for (let i = 0; i < 160; i++) {
      const x0 = p * pw + rnd() * pw; g.strokeStyle = rnd() < 0.6 ? dark : light; g.globalAlpha = 0.04 + rnd() * 0.12; g.lineWidth = 0.4 + rnd() * 1.5;
      g.beginPath();
      for (let y = 0; y <= size; y += 8) { const x = Math.min(p * pw + pw - 1, Math.max(p * pw + 1, x0 + (n(y / 160 + i) - 0.5) * 5)); y === 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
      g.stroke();
    }
    g.globalAlpha = 0.55; g.fillStyle = '#2a170a'; g.fillRect(p * pw, 0, 2, size); // seam
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// ---------- scene ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(TRAY ? 16 : STUMP ? 24 : 20, W / H, 0.1, 100);
if (TRAY) { camera.position.set(0, 3.9, 22); camera.lookAt(0, 1.55, 0); }
else if (STUMP) { camera.position.set(0, 5.4, 19.5); camera.lookAt(0, 2.9, 0); }
else { camera.position.set(0, 7.2, 24); camera.lookAt(0, 3.0, 0); }

scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3b2a1a, 0.9));
{
  const env = new THREE.Scene();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 p; void main(){ float t = clamp(p.y*0.5+0.5,0.0,1.0); vec3 c = mix(vec3(0.16,0.11,0.07), vec3(1.0,0.93,0.82), smoothstep(0.35,0.9,t)); float soft = smoothstep(0.85,1.0, dot(p, normalize(vec3(-0.5,0.7,0.5)))); c += vec3(1.6,1.4,1.1)*soft; gl_FragColor = vec4(c,1.0); }',
  }));
  env.add(dome);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.02).texture;
  scene.environmentIntensity = 0.4;
}
const key = new THREE.DirectionalLight(0xffe2b8, 2.6);
key.position.set(-6, 11, 9); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 9; key.shadow.bias = -0.0012; key.shadow.normalBias = 0.06;
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 9, bottom: -9, near: 1, far: 40 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xffd9a0, 1.1); rim.position.set(7, 5, -6); scene.add(rim);
const fill = new THREE.DirectionalLight(0xfff4e6, 0.55); fill.position.set(4, 2, 12); scene.add(fill);

// rounded-edge cylinder via lathe (bevel on top and bottom)
function roundedCylinder(r, h, bevel, seg = 128) {
  const pts = [];
  pts.push(new THREE.Vector2(0.0001, 0));
  pts.push(new THREE.Vector2(r - bevel, 0));
  for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + (i / 8) * (Math.PI / 2); pts.push(new THREE.Vector2(r - bevel + Math.cos(a) * bevel, bevel + Math.sin(a) * bevel)); }
  for (let i = 0; i <= 8; i++) { const a = (i / 8) * (Math.PI / 2); pts.push(new THREE.Vector2(r - bevel + Math.cos(a) * bevel, h - bevel + Math.sin(a) * bevel)); }
  pts.push(new THREE.Vector2(0.0001, h));
  return new THREE.LatheGeometry(pts, seg);
}

function woodBlock(r, h, colors) {
  const group = new THREE.Group();
  const side = sideGrain(2048, 512, colors.base, colors.dark, colors.light);
  side.repeat.set(2, 1);
  const sideMat = new THREE.MeshPhysicalMaterial({ map: side, roughness: 0.5, clearcoat: 0.35, clearcoatRoughness: 0.35, bumpMap: side, bumpScale: 0.6 });
  const body = new THREE.Mesh(roundedCylinder(r, h, 0.06), sideMat);
  body.castShadow = true; body.receiveShadow = true; group.add(body);
  const top = endGrain(1024, colors.top, colors.ring, colors.center);
  const topMat = new THREE.MeshPhysicalMaterial({ map: top, roughness: 0.45, clearcoat: 0.4, clearcoatRoughness: 0.3 });
  const cap = new THREE.Mesh(new THREE.RingGeometry(0.0005, r - 0.055, 128, 24), topMat);
  cap.rotation.x = -Math.PI / 2; cap.position.y = h + 0.0005; cap.receiveShadow = true; group.add(cap);
  return group;
}

const oak = { base: '#8f5a2c', dark: '#4f2c10', light: '#bf8649', top: '#c08a50', ring: '#704320', center: '#d9a666' };
const walnut = { base: '#74461f', dark: '#3e220b', light: '#a8723f', top: '#b57f48', ring: '#633a19', center: '#d09a5f' };

// platform
const platR = 9.4, platH = 0.5;
const planksTex = planks(2048, '#7f4f27', '#45250d', '#b07843');
const platTop = new THREE.MeshPhysicalMaterial({ map: planksTex, roughness: 0.5, clearcoat: 0.45, clearcoatRoughness: 0.3 });
const platSideTex = sideGrain(2048, 256, '#7b4f2a', '#45260f', '#a8774a'); platSideTex.repeat.set(6, 1);
const platSide = new THREE.MeshPhysicalMaterial({ map: platSideTex, roughness: 0.5, clearcoat: 0.35 });
const plat = new THREE.Mesh(roundedCylinder(platR, platH, 0.08, 192), platSide);
plat.receiveShadow = true; plat.castShadow = true; if (!STUMP && !TRAY) scene.add(plat);
const platCap = new THREE.Mesh(new THREE.RingGeometry(0.0005, platR - 0.075, 192, 48), platTop);
platCap.rotation.x = -Math.PI / 2; platCap.position.y = platH + 0.0005; platCap.receiveShadow = true; if (!STUMP && !TRAY) scene.add(platCap);

// blocks: outer ones taller and further back, the middle one lowest and in front
const blocks = TRAY ? [] : STUMP ? [{ x: 0, z: 0, r: 3.3, h: 1.55, wood: walnut, y0: 0 }] : [
  { x: -6.55, z: -1.7, r: 1.55, h: 2.0, wood: oak },
  { x: -3.3, z: -0.25, r: 1.5, h: 1.6, wood: walnut },
  { x: 0.0, z: 0.55, r: 1.48, h: 1.25, wood: oak },
  { x: 3.3, z: -0.25, r: 1.5, h: 1.6, wood: walnut },
  { x: 6.55, z: -1.7, r: 1.55, h: 2.0, wood: oak },
];
for (const b of blocks) {
  const m = woodBlock(b.r, b.h, b.wood);
  m.position.set(b.x, b.y0 ?? platH, b.z);
  m.rotation.y = rnd() * Math.PI;
  scene.add(m);
}

// ---------- the carved round tray (hero) ----------
const TRAY_R = 6.3, TRAY_FLOOR = 0.24;
function ornamentBand(size, inner, outer) {
  // kochkor-muyuz curls carved into a ring: dark grooves with a light edge
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const cx = size / 2, cy = size / 2, rIn = (inner / outer) * size / 2, rOut = size / 2;
  g.clearRect(0, 0, size, size);
  const n = 36, mid = (rIn + rOut) / 2, amp = (rOut - rIn) * 0.42;
  const curl = (dx, dy, color, width) => {
    g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const p = (r, t) => [cx + dx + Math.cos(a + t) * r, cy + dy + Math.sin(a + t) * r];
      const step = (Math.PI * 2) / n;
      // a wave along the band with two horn curls
      g.beginPath();
      for (let k = 0; k <= 24; k++) {
        const t = (k / 24) * step;
        const r = mid + Math.sin((k / 24) * Math.PI * 2) * amp * 0.55;
        const [x, y] = p(r, t); k === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
      for (const side of [-1, 1]) {
        const [hx, hy] = p(mid + side * amp * 0.55, step * (side < 0 ? 0.25 : 0.75));
        g.beginPath();
        for (let k = 0; k <= 30; k++) {
          const t = (k / 30) * Math.PI * 1.7;
          const rr = amp * 0.42 * (1 - k / 38);
          const ang = a + step * (side < 0 ? 0.25 : 0.75) + (side < 0 ? t : -t) * 0.9;
          const x = hx + Math.cos(ang * 6) * rr, y = hy + Math.sin(ang * 6) * rr;
          k === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
        g.stroke();
      }
    }
    // border lines of the band
    for (const r of [rIn + 6, rOut - 6]) { g.beginPath(); g.arc(cx + dx, cy + dy, r, 0, Math.PI * 2); g.stroke(); }
  };
  curl(1.5, 2, 'rgba(255,225,170,0.55)', size * 0.006); // light lower edge
  curl(0, 0, 'rgba(58,30,10,0.85)', size * 0.0055);    // groove
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
if (TRAY) {
  const pts = [new THREE.Vector2(0.0001, 0), new THREE.Vector2(TRAY_R - 0.25, 0)];
  for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + (i / 10) * Math.PI; pts.push(new THREE.Vector2(TRAY_R - 0.25 + Math.cos(a) * 0.25 * 0.9, 0.2 + Math.sin(a) * 0.2)); }
  pts.push(new THREE.Vector2(TRAY_R - 0.42, 0.36), new THREE.Vector2(TRAY_R - 0.55, TRAY_FLOOR), new THREE.Vector2(0.0001, TRAY_FLOOR));
  const edgeTex = sideGrain(2048, 256, '#7a4a22', '#3f230c', '#a76f3c'); edgeTex.repeat.set(6, 1);
  const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 256), new THREE.MeshPhysicalMaterial({ map: edgeTex, roughness: 0.42, clearcoat: 0.5, clearcoatRoughness: 0.25 }));
  body.castShadow = true; body.receiveShadow = true; scene.add(body);
  const floorTex = sideGrain(2048, 2048, '#8a5428', '#4a2a10', '#b77c45');
  const floor = new THREE.Mesh(new THREE.RingGeometry(0.0005, TRAY_R - 0.54, 256, 32), new THREE.MeshPhysicalMaterial({ map: floorTex, roughness: 0.45, clearcoat: 0.55, clearcoatRoughness: 0.22 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = TRAY_FLOOR + 0.001; floor.receiveShadow = true; scene.add(floor);
  const band = ornamentBand(4096, TRAY_R - 1.45, TRAY_R - 0.6);
  const bandMesh = new THREE.Mesh(new THREE.RingGeometry(0.0005, TRAY_R - 0.6, 256, 8), new THREE.MeshStandardMaterial({ map: band, transparent: true, roughness: 0.6 }));
  bandMesh.rotation.x = -Math.PI / 2; bandMesh.position.y = TRAY_FLOOR + 0.004; scene.add(bandMesh);
}

// shadow on the floor under the platform
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.ShadowMaterial({ opacity: STUMP || TRAY ? 0.2 : 0.32 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.001; ground.receiveShadow = true; scene.add(ground);

renderer.render(scene, camera);

// screen positions for the page (in units of a 726 × 282 stage)
const SW = 726, SH = 282;
const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return { x: (v.x + 1) / 2 * SW, y: (1 - v.y) / 2 * SH }; };
window.layout = TRAY
  ? (window.SPOTS || []).map(([x, z]) => {
      const k = proj(x, TRAY_FLOOR, z);
      return { x: +(k.x / SW * 1300).toFixed(1), y: +(k.y / SH * 520).toFixed(1) };
    })
  : STUMP
  ? [[-2.15, 0.2], [0, -2.15], [2.15, 0.2], [0, 2.55]].map(([x, z]) => {
      const top = 1.55, k = proj(x, top, z), sw = 360, sh = 300;
      // stage units → stump box units (360 × 300)
      return { x: +(k.x / SW * sw).toFixed(1), y: +(k.y / SH * sh).toFixed(1) };
    })
  : blocks.map((b) => {
  const topY = platH + b.h;
  const center = proj(b.x, topY, b.z);            // where a product stands
  const frontTop = proj(b.x, topY - 0.08, b.z + b.r);
  const frontBottom = proj(b.x, platH + 0.08, b.z + b.r);
  const left = proj(b.x - b.r * 0.78, platH + b.h * 0.5, b.z + b.r * 0.62);
  const right = proj(b.x + b.r * 0.78, platH + b.h * 0.5, b.z + b.r * 0.62);
  const width = proj(b.x + b.r, topY, b.z).x - proj(b.x - b.r, topY, b.z).x;
  return { cx: +center.x.toFixed(1), standY: +center.y.toFixed(1), blockW: +width.toFixed(1), frontTop: +frontTop.y.toFixed(1), frontBottom: +frontBottom.y.toFixed(1), plateL: +left.x.toFixed(1), plateR: +right.x.toFixed(1) };
    });
window.done = true;
</script>
</body>
</html>
