# Fly.io configuration for the NUSKA_etno API.
# Deploy from the repository root:
#   fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile .
# Secrets (fly secrets set ...): DATABASE_URL, DIRECT_URL, JWT_SECRET, PROXY_SECRET,
# WEB_URL (the site address, used in e-mail links), SMTP_*, MAIL_FROM, S3_* — see docs/deployment.md.

app = "nuska-api"
primary_region = "fra" # Frankfurt: next to Neon eu-central-1 and Vercel fra1

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies pending Prisma migrations before the new version starts; a failure aborts the deploy.
  release_command = "node_modules/prisma/build/index.js migrate deploy"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  TRUST_PROXY = "true"
  SWAGGER_ENABLED = "false"
  JWT_EXPIRES_IN = "15m"
  BCRYPT_ROUNDS = "12"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
