# Render Blueprint: the NUSKA_etno API on the free plan (Docker, Frankfurt).
# Render → New → Blueprint → select this repository. It asks for the values
# marked `sync: false`; JWT_SECRET and PROXY_SECRET are generated by Render.
# Every push to main rebuilds and redeploys the API; migrations run at start.
services:
  - type: web
    name: nuska-etno-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIGRATE_ON_START
        value: 'true'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: JWT_SECRET
        generateValue: true
      # Copy this generated value into Vercel as API_PROXY_SECRET.
      - key: PROXY_SECRET
        generateValue: true
      # Neon "Pooled" connection string + &pgbouncer=true&connect_timeout=15
      - key: DATABASE_URL
        sync: false
      # Neon "Direct" connection string (used for migrations)
      - key: DIRECT_URL
        sync: false
      # Website address, e.g. https://<project>.vercel.app (used in e-mail links)
      - key: WEB_URL
        sync: false
