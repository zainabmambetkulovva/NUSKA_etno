name: Deploy API

# Deploys apps/api to Fly.io after CI passes on main.
# Requires the repository secret FLY_API_TOKEN (fly tokens create deploy -a nuska-api).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN is not set — skipping deploy (see docs/deployment.md)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@v1
        if: env.SKIP != '1'
      - name: fly deploy
        if: env.SKIP != '1'
        run: flyctl deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile --remote-only .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
