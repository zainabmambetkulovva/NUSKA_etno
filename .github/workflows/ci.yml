name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuska_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nuska_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: API unit tests
        run: pnpm --filter @nuska/api test
      - name: API e2e tests (PostgreSQL)
        run: pnpm --filter @nuska/api test:e2e
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t nuska-api .

  # Browser tests of the whole site (TZ §23): real PostgreSQL, API and website.
  e2e-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuska_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nuska_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nuska_e2e
      # Test-only values (CI database, never production).
      JWT_SECRET: ci-e2e-jwt-secret-0123456789-abcdefghijklmn
      PROXY_SECRET: ci-e2e-proxy-secret-0123456789-abcdefghij
      API_PROXY_SECRET: ci-e2e-proxy-secret-0123456789-abcdefghij
      API_INTERNAL_URL: http://localhost:4000
      SEED_ADMIN_PASSWORD: ci-admin-pass-123
      SEED_CUSTOMER_PASSWORD: ci-customer-pass-123
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Database with demo data
        run: |
          pnpm --filter @nuska/api exec prisma migrate deploy
          pnpm db:seed
      - name: Build API and website
        run: pnpm build
      - name: Start API and website
        run: |
          (cd apps/api && NODE_ENV=test THROTTLE_DISABLED=true PORT=4000 node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && pnpm start -p 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          cat api.log web.log
          exit 1
      - name: Install Chromium
        run: pnpm --filter @nuska/web exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm --filter @nuska/web test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            web.log
          retention-days: 7
